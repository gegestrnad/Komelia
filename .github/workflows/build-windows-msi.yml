name: Build Windows MSI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: 'snapshot'

permissions:
  contents: write

jobs:
  # Cross-compile the Windows native libs (MinGW/Docker) and stage the JNI
  # DLLs into the source-tree resource dirs. Runs on Linux because the whole
  # native toolchain (apt, mingw-w64, .sh scripts) assumes it.
  build-windows-native:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize submodules with retry
        shell: bash
        run: |
          for attempt in {1..3}; do
            echo "Attempt $attempt to update submodules..."

            # NOTE: --init is required here. A bare `git submodule init`
            # only registers top-level modules, and `update --recursive`
            # without --init silently skips uninitialized *nested*
            # libjxl's third_party/skcms, and ep_jxl fails minutes later
            # inside Docker with "Please provide skcms".
            if git submodule update --init --recursive; then
              echo "Submodule update successful"
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            else
              echo "Submodule update failed after 3 attempts."
              exit 1
            fi
          done

          # Fail fast: ep_jxl configures libjxl from third_party/libjxl and
          # hard-errors without skcms/skcms.h. Catch it here, not 4 min
          # into the Docker build.
          test -f third_party/libjxl/third_party/skcms/skcms.h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Windows native binaries with Docker
        run: |
          docker build -t komelia-build-windows-x86_64 . -f ./cmake/windows-x86_64.Dockerfile
          docker run --user "$(id -u):$(id -g)" -v "$PWD:/build" komelia-build-windows-x86_64

      - name: Diagnose Windows native libs
        # Prints what the MinGW superbuild actually staged, so a future
        # submodule ABI bump (e.g. libpng16 -> libpng18) shows up here
        # instead of surfacing only as "Missing Windows native libs".
        run: |
          echo "=== sysroot/bin ==="
          ls -la "$GITHUB_WORKSPACE/cmake/build-w64/sysroot/bin/" || true
          echo
          echo "=== libpng artifacts ==="
          find "$GITHUB_WORKSPACE/cmake/build-w64" -iname '*png*' -print 2>/dev/null | sort || true

      - name: Copy JNI libs
        # windows-x86_64_copyJniLibs uses a script closure
        # (include { it.name in windowsLibs }) that the configuration
        # cache cannot serialize under Gradle 9.x; disable it here
        # instead of refactoring the build logic.
        # NOTE: runs here (not on Windows) because the task reads the
        # MinGW sysroot and /usr/x86_64-w64-mingw32 paths.
        run: ./gradlew --no-configuration-cache windows-x86_64_copyJniLibs

      - name: Upload staged JNI resources
        uses: actions/upload-artifact@v4
        with:
          name: windows-jni-resources
          path: komelia-infra/jni/src/jvmMain/resources/
          retention-days: 1

  # Package the MSI. MUST run on Windows: Compose's packageReleaseMsi needs
  # the WiX toolset, so on Linux the task silently SKIPs and no MSI exists.
  package-windows-msi:
    needs: build-windows-native
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize Gradle submodules
        # Only the Gradle composite/include builds are needed for packaging;
        # the native C/C++ submodules were already consumed by the Linux job.
        shell: bash
        run: git submodule update --init third_party/secret-service third_party/ChipTextField third_party/compose-sonner

      - name: Download staged JNI resources
        uses: actions/download-artifact@v4
        with:
          name: windows-jni-resources
          path: komelia-infra/jni/src/jvmMain/resources/

      - name: Verify staged JNI resources
        # The copy task's Sync silently skips missing DLLs; fail here rather
        # than shipping an MSI that crashes with UnsatisfiedLinkError.
        run: ./gradlew.bat --no-configuration-cache verifyWindowsJniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Windows MSI
        run: ./gradlew.bat --no-configuration-cache :desktopMsi

      - name: Find MSI file
        id: find_msi
        shell: bash
        run: |
          MSI_FILE=$(find komelia-app/desktopApp/build/compose -type f -iname "*.msi" -print -quit)
          if [ -z "$MSI_FILE" ]; then
            echo "ERROR: :desktopMsi produced no MSI file."
            echo "--- msi/exe candidates ---"
            find komelia-app/desktopApp/build -type f \( -iname "*.msi" -o -iname "*.exe" \) -print || true
            echo "--- build tree (depth 5) ---"
            find komelia-app/desktopApp/build -maxdepth 5 -type f | head -200 || true
            exit 1
          fi
          echo "Found MSI: $MSI_FILE"
          echo "MSI_FILE=$MSI_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_msi.outputs.MSI_FILE }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload MSI as artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: komelia-windows-installer-${{ needs.build-windows-native.outputs.VERSION }}
          path: ${{ steps.find_msi.outputs.MSI_FILE }}
          retention-days: 30
